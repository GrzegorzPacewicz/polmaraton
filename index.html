<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Treningowy</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#00D4FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/plan.css">
</head>
<body>

<header class="site-header">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="plan-title"></h1>

  <div class="header-meta" id="header-meta"></div>

  <div class="countdown">
    <div>
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">do startu</div>
    </div>
    <div class="cd-num" id="cd-days">—</div>
    <div class="cd-unit">dni</div>
    <div class="cd-sep">·</div>
    <div class="cd-num" id="cd-weeks">—</div>
    <div class="cd-unit">tyg</div>
  </div>

  <nav class="plan-nav" id="plan-nav" hidden></nav>
</header>

<div class="legend" id="legend"></div>

<div class="progress-wrap">
  <div class="progress-labels">
    <span>Postęp</span>
    <span id="prog-text"></span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill" style="width:0%"></div>
  </div>
</div>

<main class="plan" id="plan"></main>

<script type="module" src="js/main.js"></script>
</body>
</html>
